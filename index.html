<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bestell-App</title>
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/variables.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <img src="./assets/icons/logo-header.png" alt="BestellApp-symbol" />
        <button type="button"><span></span><span></span><span></span></button>
      </nav>
    </header>

    <section class="hero-section">
      <img src="./assets/img/hero-img.jpg" alt="Burger, Fritten und Pizza" />
    </section>

    <section class="shop-info">
      <img
        class="shop-logo"
        src="./assets/icons/logo-icon.png"
        alt="BurgerHouse-logo"
      />
      <h1><span>Burger</span>House</h1>
      <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>
    </section>

    <main class="content">
      <div id="menu"></div>
      <aside class="basket">
        <h2>Your Basket</h2>
      </aside>
    </main>
    <script src="./scripts/db.js"></script>
    <script src="./scripts/script.js"></script>
  </body>
</html>
